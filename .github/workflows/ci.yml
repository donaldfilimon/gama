name: Gama acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR revisions share a cancellable group; every other event gets a unique
  # group so queued main-push evidence cannot be replaced by a later push.
  group: gama-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zig-acceptance:
    name: Pinned Zig retained acceptance
    if: >
      github.repository == 'donaldfilimon/gama' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, macOS, ARM64, gama]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retained acceptance with preinstalled pinned tools
        shell: bash
        run: |
          set -euo pipefail
          scripts/check.sh 2>&1 | tee acceptance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zig-evidence
          path: |
            acceptance.log
            zig-out/matrix
            zig-out/wasm
            zig-out/embedded
