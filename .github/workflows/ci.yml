name: Gama acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gama-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-swift-64:
    name: macOS / Apple Swift 6.4
    # Preview image whose default toolchain is Xcode 27 / Apple Swift 6.4.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select and verify Xcode default toolchain
        run: |
          unset TOOLCHAINS
          /usr/bin/xcrun --toolchain default swift --version | tee swift-version.txt
          grep -q 'Swift version 6.4' swift-version.txt
      - name: Core, macros, POSIX TUI, Apple UI
        run: ./scripts/check-apple.sh
      - name: iOS, tvOS, and visionOS compile
        run: ./scripts/check-apple-platforms.sh
      - name: Source boundaries and documentation
        run: ./scripts/check-boundaries.sh && ./scripts/check-docs.sh
      - name: MLIR parse
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          PATH="$(brew --prefix llvm)/bin:$PATH" ./scripts/check-mlir.sh
      - name: Qt adapter
        run: |
          brew install qtbase
          QT_PREFIX="$(brew --prefix qtbase)" ./scripts/check-qt.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-evidence
          path: |
            swift-version.txt
            Sources/GamaEmbedABI/include/GamaEmbed.h

  linux-swift-64:
    name: Linux / Swift 6.4 native and static SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GAMA_SWIFT_64_URL: https://download.swift.org/swift-6.4.x-branch/ubuntu2404/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a-ubuntu24.04.tar.gz
      GAMA_SWIFT_64_SHA256: dae1f550c6e9132322a3c35b5fa16c925e591879a681733ea9b652534b9c8902
      GAMA_LINUX_SDK_ID: swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a_static-linux-0.1.0
      GAMA_SWIFT_SDK_ID: swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a_static-linux-0.1.0
      GAMA_SWIFT_SDK_URL: https://download.swift.org/swift-6.4.x-branch/static-sdk/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a_static-linux-0.1.0.artifactbundle.tar.gz
      GAMA_SWIFT_SDK_SHA256: 60964bf3ed1b25b9a002e2b5bb3fa7ed4f7b686a57816c5ddfa3784eeb0823d5
    steps:
      - uses: actions/checkout@v4
      - name: Install snapshot
        run: ./scripts/ci-install-swift-snapshot.sh
      - name: Install matching static Linux SDK
        run: ./scripts/ci-install-swift-sdk.sh
      - name: Native tests
        run: swift test
      - name: C ABI consumer compile, link, and run
        run: ./scripts/check-c-abi.sh
      - name: Address Sanitizer
        run: swift test --sanitize address
      - name: Thread Sanitizer
        run: swift test --sanitize thread
      - name: Static Linux SDK
        run: ./scripts/check-linux.sh

  wasm-swift-64:
    name: WebAssembly / Swift 6.4 SDK and runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GAMA_SWIFT_64_URL: https://download.swift.org/swift-6.4.x-branch/ubuntu2404/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a-ubuntu24.04.tar.gz
      GAMA_SWIFT_64_SHA256: dae1f550c6e9132322a3c35b5fa16c925e591879a681733ea9b652534b9c8902
      GAMA_WASM_SDK_ID: swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a_wasm
      GAMA_SWIFT_SDK_ID: swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a_wasm
      GAMA_SWIFT_SDK_URL: https://download.swift.org/swift-6.4.x-branch/wasm-sdk/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a_wasm.artifactbundle.tar.gz
      GAMA_SWIFT_SDK_SHA256: 11fabfac6804222569d330fbbb5fa34eef736abda46790e723ac73b256fd1c7a
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci-install-swift-snapshot.sh
      - run: ./scripts/ci-install-swift-sdk.sh
      - run: ./scripts/check-wasm.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-artifacts
          path: .build/artifacts/gama-web-demo.wasm

  android-swift-64:
    name: Android / Swift 6.4 embedding and emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GAMA_SWIFT_64_URL: https://download.swift.org/swift-6.4.x-branch/ubuntu2404/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a-ubuntu24.04.tar.gz
      GAMA_SWIFT_64_SHA256: dae1f550c6e9132322a3c35b5fa16c925e591879a681733ea9b652534b9c8902
      GAMA_ANDROID_SDK_ID: swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a_android
      GAMA_SWIFT_SDK_ID: swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a_android
      GAMA_SWIFT_SDK_URL: https://download.swift.org/swift-6.4.x-branch/android-sdk/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a_android.artifactbundle.tar.gz
      GAMA_SWIFT_SDK_SHA256: 0f0fc710504b1221397b32c4dff6a6360caf385e336c1d96380811459a87cb9b
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci-install-swift-snapshot.sh
      - run: ./scripts/ci-install-swift-sdk.sh
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android NDK
        run: sdkmanager 'ndk;30.0.15729638' 'platforms;android-36' 'build-tools;36.0.0' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'
      - name: Cross-compile GamaEmbed
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.15729638" ./scripts/check-android.sh
      - name: Required emulator input/frame round trip
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./scripts/check-android-emulator.sh

  embedded-swift-64:
    name: Embedded / exact Swift 6.4 snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GAMA_SWIFT_64_URL: https://download.swift.org/swift-6.4.x-branch/ubuntu2404/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a-ubuntu24.04.tar.gz
      GAMA_SWIFT_64_SHA256: dae1f550c6e9132322a3c35b5fa16c925e591879a681733ea9b652534b9c8902
      GAMA_EMBEDDED_OUTPUT: .build/artifacts/GamaCore.embedded.o
      GAMA_EMBEDDED_LINKED_OUTPUT: .build/artifacts/GamaCore.embedded.linked.o
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci-install-swift-snapshot.sh
      - run: ./scripts/check-embedded.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-artifacts
          path: |
            .build/artifacts/GamaCore.embedded.o
            .build/artifacts/GamaCore.embedded.linked.o

  windows-swift-64:
    name: Windows / native console Swift 6.4
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      GAMA_SWIFT_64_WINDOWS_URL: https://download.swift.org/swift-6.4.x-branch/windows10/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a-windows10.exe
      GAMA_SWIFT_64_WINDOWS_SHA256: 17d5eba8dfdc9e99bf13c0f26169022be2f816b19e66d883a596d3512cfb0a04
    steps:
      - uses: actions/checkout@v4
      - name: Install checksum-pinned Windows snapshot
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'swift-6.4.exe'
          Invoke-WebRequest -Uri $env:GAMA_SWIFT_64_WINDOWS_URL -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne $env:GAMA_SWIFT_64_WINDOWS_SHA256) { throw 'Swift installer checksum mismatch.' }
          $process = Start-Process -FilePath $installer -ArgumentList '/install', '/quiet', '/norestart' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Swift installer failed with $($process.ExitCode)." }
          $roots = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\Swift'),
            'C:\Library\Developer\Toolchains'
          ) | Where-Object { Test-Path $_ }
          $swift = $roots | ForEach-Object { Get-ChildItem $_ -Filter swift.exe -Recurse } | Select-Object -First 1
          if (-not $swift) { throw 'Installed swift.exe not found.' }
          $sdk = $roots | ForEach-Object { Get-ChildItem $_ -Directory -Filter Windows.sdk -Recurse } | Select-Object -First 1
          if (-not $sdk) { throw 'Installed Windows.sdk not found.' }
          $runtimeBin = $roots | ForEach-Object {
            Get-ChildItem $_ -Directory -Filter bin -Recurse |
              Where-Object { $_.FullName -match '\\Runtimes\\[^\\]+\\usr\\bin$' }
          } | Select-Object -First 1
          if (-not $runtimeBin) { throw 'Installed Swift runtime bin directory not found.' }
          $swift.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $runtimeBin.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "SDKROOT=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure the Visual C++ build environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Verify and test native console implementation
        shell: pwsh
        run: |
          swift --version | Tee-Object -FilePath swift-version.txt
          Select-String -Path swift-version.txt -Pattern 'Swift version 6.4' -Quiet | ForEach-Object { if (-not $_) { throw 'Wrong Swift version.' } }
          Select-String -Path swift-version.txt -Pattern 'Swift 424cae54c1a10da' -Quiet | ForEach-Object { if (-not $_) { throw 'Wrong Swift snapshot.' } }
          swift test
          swift run gama-windows-console-smoke
