name: Gama acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR revisions share a cancellable group; every other event gets a unique
  # group so queued main-push evidence cannot be replaced by a later push.
  group: gama-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos-swift-64:
    name: macOS / Apple Swift 6.5-dev
    if: >
      github.repository == 'donaldfilimon/gama' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    # Trusted same-repo events run on the macOS arm64 self-hosted runner
    # registered to this repository with the label gama. It needs Xcode 27
    # (xcodebuild platform gates use its default 6.4 toolchain) and Homebrew.
    # Fork PRs get no CI job: never schedule untrusted code on the
    # self-hosted machine. See docs/SelfHostedRunner.md.
    runs-on: [self-hosted, macOS, ARM64, gama]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # check-evidence-freshness.sh resolves capability anchors against
          # history; the default depth-1 clone has none of them, so the gate
          # would fail closed on every run.
          fetch-depth: 0
      - name: Install pinned Swift 6.5-dev snapshot toolchain
        env:
          GAMA_MACOS_TOOLCHAIN_URL: https://download.swift.org/development/xcode/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a-osx.pkg
          GAMA_MACOS_TOOLCHAIN_SHA256: 0a2437602704f1ceb6024452b5fa17be7c82bae3cd1d4a3569affd7706e27cbc
        run: |
          unset TOOLCHAINS
          # The self-hosted runner shares the developer's account and its
          # ~/Library/Developer/Toolchains. When the pinned snapshot is
          # already there with the exact swiftc from Toolchains.toml, reuse
          # it: no download, and never reinstall over the local copy.
          source scripts/lib/toolchain.sh
          swiftc="$(gama_snapshot_swiftc)"
          want="$(gama_toml_get snapshot swiftc_sha256)"
          if [[ -x "$swiftc" && "$(shasum -a 256 "$swiftc" | awk '{print $1}')" == "$want" ]]; then
            echo "pinned snapshot already installed: $swiftc"
          else
            pkg="$RUNNER_TEMP/swift-snapshot.pkg"
            curl --fail --location --retry 3 "$GAMA_MACOS_TOOLCHAIN_URL" --output "$pkg"
            echo "$GAMA_MACOS_TOOLCHAIN_SHA256  $pkg" | shasum -a 256 --check --strict
            # Per-user install into ~/Library/Developer/Toolchains: the
            # runner account needs no sudo.
            installer -pkg "$pkg" -target CurrentUserHomeDirectory
          fi
          /usr/bin/xcrun --toolchain org.swift.65202608211a swift --version | tee swift-version.txt
          grep -q 'Swift version 6.5' swift-version.txt
          grep -q 'Swift 95c5142e84b82c1' swift-version.txt
      - name: Core, macros, POSIX TUI, Apple UI
        run: ./scripts/check-apple.sh
      - name: iOS, tvOS, and visionOS compile
        run: ./scripts/check-apple-platforms.sh
      - name: Source boundaries and documentation
        run: ./scripts/check-boundaries.sh && ./scripts/check-concurrency-negative.sh && ./scripts/check-docs.sh && ./scripts/check-doc-coverage.sh && ./scripts/check-evidence-freshness.sh && ./scripts/check-package-graph.sh
      - name: MLIR parse
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          PATH="$(brew --prefix llvm)/bin:$PATH" ./scripts/check-mlir.sh
      - name: Stage and verify the macOS app bundle
        run: GAMA_DIST_ROOT="$RUNNER_TEMP/gama-dist" ./scripts/bundle-macos.sh
      - name: Archive the macOS app bundle for transport
        run: |
          source scripts/lib/manifest.sh
          name="$(manifest_get Distribution/gama-apple-demo.toml app name)"
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/gama-dist/$name.app" "$RUNNER_TEMP/macos-app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: ${{ runner.temp }}/macos-app.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-evidence
          path: |
            swift-version.txt
            Sources/GamaEmbedABI/include/GamaEmbed.h

  embedded-swift-64:
    name: Embedded / exact Swift 6.5-dev snapshot
    # Same trust guard and runner as the macOS job: check-embedded.sh needs
    # only the exact macOS snapshot (its swiftc SHA-256 and ld.lld), which
    # the step below installs per user where scripts/lib/toolchain.sh looks.
    if: >
      github.repository == 'donaldfilimon/gama' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, macOS, ARM64, gama]
    timeout-minutes: 30
    env:
      GAMA_EMBEDDED_OUTPUT: .build/artifacts/GamaCore.embedded.o
      GAMA_EMBEDDED_LINKED_OUTPUT: .build/artifacts/GamaCore.embedded.linked.o
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Swift 6.5-dev snapshot toolchain
        env:
          GAMA_MACOS_TOOLCHAIN_URL: https://download.swift.org/development/xcode/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a-osx.pkg
          GAMA_MACOS_TOOLCHAIN_SHA256: 0a2437602704f1ceb6024452b5fa17be7c82bae3cd1d4a3569affd7706e27cbc
        run: |
          unset TOOLCHAINS
          # The self-hosted runner shares the developer's account and its
          # ~/Library/Developer/Toolchains. When the pinned snapshot is
          # already there with the exact swiftc from Toolchains.toml, reuse
          # it: no download, and never reinstall over the local copy.
          source scripts/lib/toolchain.sh
          swiftc="$(gama_snapshot_swiftc)"
          want="$(gama_toml_get snapshot swiftc_sha256)"
          if [[ -x "$swiftc" && "$(shasum -a 256 "$swiftc" | awk '{print $1}')" == "$want" ]]; then
            echo "pinned snapshot already installed: $swiftc"
          else
            pkg="$RUNNER_TEMP/swift-snapshot.pkg"
            curl --fail --location --retry 3 "$GAMA_MACOS_TOOLCHAIN_URL" --output "$pkg"
            echo "$GAMA_MACOS_TOOLCHAIN_SHA256  $pkg" | shasum -a 256 --check --strict
            # Per-user install into ~/Library/Developer/Toolchains: the
            # runner account needs no sudo.
            installer -pkg "$pkg" -target CurrentUserHomeDirectory
          fi
      - name: Embedded compile, relocatable link, and size baseline
        run: ./scripts/check-embedded.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-artifacts
          path: |
            .build/artifacts/GamaCore.embedded.o
            .build/artifacts/GamaCore.embedded.linked.o
