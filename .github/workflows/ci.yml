name: Gama acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR revisions share a cancellable group; every other event gets a unique
  # group so queued main-push evidence cannot be replaced by a later push.
  group: gama-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos-swift-64:
    name: macOS / Apple Swift 6.5-dev
    # Preview image; Xcode 27's default toolchain stays 6.4 (xcodebuild platform
    # gates use it) while the pinned 6.5-dev snapshot is installed for primary gates.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Swift 6.5-dev snapshot toolchain
        env:
          GAMA_MACOS_TOOLCHAIN_URL: https://download.swift.org/development/xcode/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a-osx.pkg
          GAMA_MACOS_TOOLCHAIN_SHA256: 0a2437602704f1ceb6024452b5fa17be7c82bae3cd1d4a3569affd7706e27cbc
        run: |
          unset TOOLCHAINS
          pkg="$RUNNER_TEMP/swift-snapshot.pkg"
          curl --fail --location --retry 3 "$GAMA_MACOS_TOOLCHAIN_URL" --output "$pkg"
          echo "$GAMA_MACOS_TOOLCHAIN_SHA256  $pkg" | shasum -a 256 --check --strict
          sudo installer -pkg "$pkg" -target /
          /usr/bin/xcrun --toolchain org.swift.65202608211a swift --version | tee swift-version.txt
          grep -q 'Swift version 6.5' swift-version.txt
          grep -q 'Swift 95c5142e84b82c1' swift-version.txt
      - name: Core, macros, POSIX TUI, Apple UI
        run: ./scripts/check-apple.sh
      - name: iOS, tvOS, and visionOS compile
        run: ./scripts/check-apple-platforms.sh
      - name: Source boundaries and documentation
        run: ./scripts/check-boundaries.sh && ./scripts/check-docs.sh && ./scripts/check-doc-coverage.sh
      - name: MLIR parse
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          PATH="$(brew --prefix llvm)/bin:$PATH" ./scripts/check-mlir.sh
      - name: Stage and verify the macOS app bundle
        run: GAMA_DIST_ROOT="$RUNNER_TEMP/gama-dist" ./scripts/bundle-macos.sh
      - name: Archive the macOS app bundle for transport
        run: |
          source scripts/lib/manifest.sh
          name="$(manifest_get Distribution/gama-apple-demo.toml app name)"
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/gama-dist/$name.app" "$RUNNER_TEMP/macos-app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: ${{ runner.temp }}/macos-app.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-evidence
          path: |
            swift-version.txt
            Sources/GamaEmbedABI/include/GamaEmbed.h

  linux-swift-64:
    name: Linux / Swift 6.5-dev native and static SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GAMA_SWIFT_64_URL: https://download.swift.org/development/ubuntu2404/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a-ubuntu24.04.tar.gz
      GAMA_SWIFT_64_SHA256: 855d0f63319043e84c8a293ee855703a9b9aa6c18686ecb88f8ee02592e879f0
      GAMA_LINUX_SDK_ID: swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a_static-linux-0.1.0
      GAMA_SWIFT_SDK_ID: swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a_static-linux-0.1.0
      GAMA_SWIFT_SDK_URL: https://download.swift.org/development/static-sdk/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a_static-linux-0.1.0.artifactbundle.tar.gz
      GAMA_SWIFT_SDK_SHA256: 2787311e738fbda99215e2af82f52fd18ed3bbdd347ccb5c5afc8d3ecb7550db
    steps:
      - uses: actions/checkout@v4
      - name: Install snapshot
        run: ./scripts/ci-install-swift-snapshot.sh
      - name: Install matching static Linux SDK
        run: ./scripts/ci-install-swift-sdk.sh
      - name: Native tests
        run: swift test
      - name: C ABI consumer compile, link, and run
        run: ./scripts/check-c-abi.sh
      - name: Address Sanitizer
        # This step keeps broad test-suite address-safety coverage. SwiftPM's
        # generated runner still loads XCTest and leaks process-lifetime suite
        # metadata, so leak detection is disabled for this process only.
        env:
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/scripts/lsan-suppressions.supp:print_suppressions=1
        run: swift test --sanitize address
      - name: Harness-free LeakSanitizer with negative control
        # Builds and directly executes gama-leak-check: no Swift Testing,
        # XCTest, or suppression file. The script also requires a deliberate
        # leaked GamaCore Signal to terminate with LSan's exact failure code.
        run: ./scripts/check-linux-leaks.sh
      - name: Thread Sanitizer
        run: swift test --sanitize thread
      - name: Static Linux SDK
        run: ./scripts/check-linux.sh

  wasm-swift-64:
    name: WebAssembly / Swift 6.5-dev SDK and runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GAMA_SWIFT_64_URL: https://download.swift.org/development/ubuntu2404/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a-ubuntu24.04.tar.gz
      GAMA_SWIFT_64_SHA256: 855d0f63319043e84c8a293ee855703a9b9aa6c18686ecb88f8ee02592e879f0
      GAMA_WASM_SDK_ID: swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a_wasm
      GAMA_SWIFT_SDK_ID: swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a_wasm
      GAMA_SWIFT_SDK_URL: https://download.swift.org/development/wasm-sdk/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a_wasm.artifactbundle.tar.gz
      GAMA_SWIFT_SDK_SHA256: 19cb319e07661625928f43df3fddabfa9ca4821a3215f5f5a7592c06f3d632e3
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci-install-swift-snapshot.sh
      - run: ./scripts/ci-install-swift-sdk.sh
      - run: ./scripts/check-wasm.sh
      - name: Assemble and verify the deployable wasm site
        run: GAMA_DIST_ROOT="$RUNNER_TEMP/gama-dist" ./scripts/bundle-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-site
          path: ${{ runner.temp }}/gama-dist/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-artifacts
          path: .build/artifacts/gama-web-demo.wasm

  android-swift-64:
    name: Android / Swift 6.5-dev embedding and emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GAMA_SWIFT_64_URL: https://download.swift.org/development/ubuntu2404/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a-ubuntu24.04.tar.gz
      GAMA_SWIFT_64_SHA256: 855d0f63319043e84c8a293ee855703a9b9aa6c18686ecb88f8ee02592e879f0
      GAMA_ANDROID_SDK_ID: swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a_android
      GAMA_SWIFT_SDK_ID: swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a_android
      GAMA_SWIFT_SDK_URL: https://download.swift.org/development/android-sdk/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a_android.artifactbundle.tar.gz
      GAMA_SWIFT_SDK_SHA256: 1c91679aa96ccf51c8d46d1393de8061ac66d45c5899bc6a70068e9f50e6609d
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci-install-swift-snapshot.sh
      - run: ./scripts/ci-install-swift-sdk.sh
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android NDK
        run: sdkmanager 'ndk;30.0.15729638' 'platforms;android-36' 'build-tools;36.0.0' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'
      - name: Cross-compile GamaEmbed
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.15729638" ./scripts/check-android.sh
      - name: Verify emulator readiness recovery policy
        run: ./scripts/test-android-emulator-readiness.sh
      - name: Required emulator input/frame round trip
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          script: ./scripts/check-android-emulator.sh

  embedded-swift-64:
    name: Embedded / exact Swift 6.5-dev snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GAMA_SWIFT_64_URL: https://download.swift.org/development/ubuntu2404/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a-ubuntu24.04.tar.gz
      GAMA_SWIFT_64_SHA256: 855d0f63319043e84c8a293ee855703a9b9aa6c18686ecb88f8ee02592e879f0
      GAMA_EMBEDDED_OUTPUT: .build/artifacts/GamaCore.embedded.o
      GAMA_EMBEDDED_LINKED_OUTPUT: .build/artifacts/GamaCore.embedded.linked.o
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci-install-swift-snapshot.sh
      - run: ./scripts/check-embedded.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-artifacts
          path: |
            .build/artifacts/GamaCore.embedded.o
            .build/artifacts/GamaCore.embedded.linked.o

  windows-swift-64:
    name: Windows / native console Swift 6.4.x (main-snapshot unavailable)
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      # Deliberate exception: swift.org has published no Windows main-development
      # snapshot since 2026-05-20-a (verified 2026-08-26 via the install API), so
      # Windows stays on the newest proven 6.4.x branch snapshot until Windows
      # main-snapshot publishing resumes. Every other job runs swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a.
      GAMA_SWIFT_64_WINDOWS_URL: https://download.swift.org/swift-6.4.x-branch/windows10/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a-windows10.exe
      GAMA_SWIFT_64_WINDOWS_SHA256: 17d5eba8dfdc9e99bf13c0f26169022be2f816b19e66d883a596d3512cfb0a04
    steps:
      - uses: actions/checkout@v4
      - name: Install checksum-pinned Windows snapshot
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'swift-6.4.x-snapshot.exe'
          Invoke-WebRequest -Uri $env:GAMA_SWIFT_64_WINDOWS_URL -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne $env:GAMA_SWIFT_64_WINDOWS_SHA256) { throw 'Swift installer checksum mismatch.' }
          $process = Start-Process -FilePath $installer -ArgumentList '/install', '/quiet', '/norestart' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Swift installer failed with $($process.ExitCode)." }
          $roots = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\Swift'),
            'C:\Library\Developer\Toolchains'
          ) | Where-Object { Test-Path $_ }
          $swift = $roots | ForEach-Object { Get-ChildItem $_ -Filter swift.exe -Recurse } | Select-Object -First 1
          if (-not $swift) { throw 'Installed swift.exe not found.' }
          $sdk = $roots | ForEach-Object { Get-ChildItem $_ -Directory -Filter Windows.sdk -Recurse } | Select-Object -First 1
          if (-not $sdk) { throw 'Installed Windows.sdk not found.' }
          $runtimeBin = $roots | ForEach-Object {
            Get-ChildItem $_ -Directory -Filter bin -Recurse |
              Where-Object { $_.FullName -match '\\Runtimes\\[^\\]+\\usr\\bin$' }
          } | Select-Object -First 1
          if (-not $runtimeBin) { throw 'Installed Swift runtime bin directory not found.' }
          $swift.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $runtimeBin.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "SDKROOT=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure the Visual C++ build environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Verify and test native console implementation
        shell: pwsh
        run: |
          swift --version | Tee-Object -FilePath swift-version.txt
          Select-String -Path swift-version.txt -Pattern 'Swift version 6.4' -Quiet | ForEach-Object { if (-not $_) { throw 'Wrong Swift version.' } }
          Select-String -Path swift-version.txt -Pattern 'Swift 424cae54c1a10da' -Quiet | ForEach-Object { if (-not $_) { throw 'Wrong Swift snapshot.' } }
          swift test
          swift run gama-windows-console-smoke
