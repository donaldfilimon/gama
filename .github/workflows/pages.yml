name: Deploy Gama Web Demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, verify, and deploy the WASM site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GAMA_SWIFT_64_URL: https://download.swift.org/development/ubuntu2404/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a-ubuntu24.04.tar.gz
      GAMA_SWIFT_64_SHA256: 855d0f63319043e84c8a293ee855703a9b9aa6c18686ecb88f8ee02592e879f0
      GAMA_WASM_SDK_ID: swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a_wasm
      GAMA_SWIFT_SDK_ID: swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a_wasm
      GAMA_SWIFT_SDK_URL: https://download.swift.org/development/wasm-sdk/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a_wasm.artifactbundle.tar.gz
      GAMA_SWIFT_SDK_SHA256: 19cb319e07661625928f43df3fddabfa9ca4821a3215f5f5a7592c06f3d632e3
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
      - name: Install the pinned Swift 6.5-dev snapshot
        run: ./scripts/ci-install-swift-snapshot.sh
      - name: Install the matching WASM SDK
        run: ./scripts/ci-install-swift-sdk.sh
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Assemble and browser-smoke the deployable site
        run: GAMA_DIST_ROOT="$RUNNER_TEMP/gama-pages" ./scripts/bundle-web.sh
      - name: Upload the verified Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/gama-pages/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
