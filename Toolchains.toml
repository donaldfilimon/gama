schema = 1

# Single pinned compiler for every gate except the xcodebuild platform gates
# (which must use Xcode's integrated 6.4 toolchain) and the Windows job (see
# [windows_exception]). Selected locally by `.swift-version`.
# Verified 2026-08-26: swift.org's newest complete main-development set
# (macOS pkg, ubuntu24.04 tarball, static-linux / wasm / android SDKs) is
# still 2026-08-21-a; no 08-22..08-26 main snapshot tag exists. Windows main
# snapshots remain 2026-05-20-a, so [windows_exception] stays on 6.4.x.
[snapshot]
selector = "main-snapshot-2026-08-21"
version = "Apple Swift version 6.5-dev"
xctoolchain = "swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a.xctoolchain"
xctoolchain_id = "org.swift.65202608211a"
swift_revision = "95c5142e84b82c1"
llvm_revision = "64c3046d94ae7cc"
swiftc_sha256 = "dbbd4d7b467ad2f0cc7e451b4f828c76a4ba2ba3cf1b7bb7f5514cee1f9c9188"
command = "/usr/bin/xcrun --toolchain org.swift.65202608211a swift"
status = "pinned-installed"
policy = "compiler and Swift SDK revisions must match exactly"

[snapshot.macos]
url = "https://download.swift.org/development/xcode/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a-osx.pkg"
sha256 = "0a2437602704f1ceb6024452b5fa17be7c82bae3cd1d4a3569affd7706e27cbc"

[snapshot.linux_x86_64]
url = "https://download.swift.org/development/ubuntu2404/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a/swift-DEVELOPMENT-SNAPSHOT-2026-08-21-a-ubuntu24.04.tar.gz"
sha256 = "855d0f63319043e84c8a293ee855703a9b9aa6c18686ecb88f8ee02592e879f0"

# Xcode's integrated toolchain. Not the primary compiler: it is used only by
# the xcodebuild iOS/tvOS/visionOS gates, which is also why the manifest stays
# `swift-tools-version: 6.4`.
[xcode_default]
channel = "XcodeDefault"
swift = "6.4"
swiftlang = "6.4.0.33.1"
clang = "2100.3.33.1"
command = "/usr/bin/xcrun --toolchain default swift"
used_by = "scripts/check-apple-platforms.sh"

# Deliberate exception, not drift: swift.org has published no Windows
# main-development snapshot since 2026-05-20-a (verified 2026-08-26), so the
# Windows job stays on the newest proven 6.4.x branch snapshot. Windows is NOT
# verified on 6.5-dev; revisit when Windows main snapshots resume.
[windows_exception]
selector = "6.4.x-snapshot-2026-08-14"
swift_revision = "424cae54c1a10da"
url = "https://download.swift.org/swift-6.4.x-branch/windows10/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a-windows10.exe"
